[project]
name = "webhook-recovery"
version = "0.1.0"
description = "Webhook delivery system built for graceful recovery after a provider outage"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "greenlet>=3.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 110
src = ["."]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",   # comprehensions
    "SIM",  # simplify
    "TID",  # tidy imports
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
# clock.py is the one place allowed to read the wall clock -- everything else
# goes through the Clock protocol.
"app/core/clock.py" = ["TID251"]
"alembic/**" = ["E501", "I001"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's whole dependency-injection idiom is a call in an argument default.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body", "fastapi.Header"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# The clock is derived, never read from the wall directly (TECHNICAL_DESIGN.md
# §The Virtual Clock). Nothing outside app/core/clock.py may call datetime.now()
# or utcnow() -- unenforceable once there are fifty call sites, trivial now.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"datetime.datetime.now".msg = "Read time through the Clock protocol (app.core.clock), not the wall clock."
"datetime.datetime.utcnow".msg = "Read time through the Clock protocol (app.core.clock), not the wall clock."
"datetime.utcnow".msg = "Read time through the Clock protocol (app.core.clock), not the wall clock."

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
# One event loop for the whole run. The session-scoped engine's asyncpg
# connections belong to the loop that created them, so a per-test loop hands
# them to a loop that is not running them: "another operation is in progress".
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-q"
# Dump every thread's stack after 30s in one test and abort, rather than
# hanging forever. A deadlocked async test is otherwise indistinguishable from
# a slow one, and the stack trace names the culprit immediately.
faulthandler_timeout = 30
